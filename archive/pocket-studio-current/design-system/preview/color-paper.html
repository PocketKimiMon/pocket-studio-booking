<!-- @dsCard group="Colors" subtitle="Paper scale — light surfaces" width="700" height="190" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:64px; border-radius:10px; border:1px solid var(--hairline); }
  .nm { font-family:var(--font-mono); font-size:10px; color:var(--fg3); }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
</style>
</head><body>
  <div class="col" style="gap:10px">
    <div class="mono-cap" style="color:var(--amber)">Paper scale · warm cream · .theme-paper light surfaces</div>
    <div class="grid">
      <div class="sw"><div class="chip" style="background:var(--paper-50)"></div><span class="nm">50</span></div>
      <div class="sw"><div class="chip" style="background:var(--paper-100)"></div><span class="nm">100</span></div>
      <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><span class="nm">200</span></div>
      <div class="sw"><div class="chip" style="background:var(--paper-300)"></div><span class="nm">300</span></div>
      <div class="sw"><div class="chip" style="background:var(--paper-400)"></div><span class="nm">400</span></div>
    </div>
    <div class="small muted" style="font-size:12px;font-family:var(--font-sans)">Used for marketing long-form &amp; podcast notes. 100 is the base cream; text flips to ink (#181426).</div>
  </div>
</body></html>
