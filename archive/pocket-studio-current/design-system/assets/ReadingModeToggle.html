<!-- @dsCard group="Components" name="ReadingModeToggle" subtitle="Accessible dyslexia reading-mode switch (ON by default)" viewport="700x220" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../preview/card.css">
<style>
  body { display: flex; align-items: center; }
  .demo { display: flex; flex-direction: column; gap: 16px; width: 100%; }
  .demo-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .demo-paper { background: var(--paper-100); border-radius: var(--radius-lg); padding: 14px 16px; }
</style>
</head>
<body>
  <div class="demo">
    <div class="mono-cap" style="color:var(--cyan)">ReadingModeToggle · role="switch" · persisted · 44px target</div>
    <div class="demo-row">
      <div id="full"></div>
      <div id="compact"></div>
      <div class="theme-paper demo-paper"><div id="paper"></div></div>
    </div>
    <div class="small muted" style="font-size:12px">Full · compact · on the paper theme. Flips <code class="mono" style="color:var(--cyan)">html[data-reading-mode]</code> and saves the choice.</div>
  </div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="../_ds_bundle.js"></script>
  <script>
    const { ReadingModeToggle } = window.PocketStudioDesignSystem_e65546;
    ReactDOM.createRoot(document.getElementById('full')).render(React.createElement(ReadingModeToggle));
    ReactDOM.createRoot(document.getElementById('compact')).render(React.createElement(ReadingModeToggle, { compact: true }));
    ReactDOM.createRoot(document.getElementById('paper')).render(React.createElement(ReadingModeToggle));
  </script>
</body>
</html>
