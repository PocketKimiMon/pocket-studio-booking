    <rect x="2" y="8" width="22" height="12" rx="2"/>
    <rect x="5" y="2" width="16" height="8" rx="1"/>
    <path d="M8 2 V-2 M13 2 V-3 M18 2 V-2" stroke-linecap="round"/>
  </g>
  <circle cx="540" cy="20" r="2" fill="#FF6A00"/>
  <!-- scissors again for tile loop -->
  <g transform="translate(568 8)" stroke="#FF6A00" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="5" cy="5" r="4"/><circle cx="5" cy="19" r="4"/>
    <path d="M8 8 L22 22 M8 16 L22 2"/>
