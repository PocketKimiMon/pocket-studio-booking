  <circle cx="730" cy="20" r="2" fill="#FF6A00"/>
  <g transform="translate(760 6)" stroke="#FF6A00" stroke-width="2" fill="none">
    <path d="M4 10 C4 6 8 4 14 4 H26 C32 4 36 6 36 10 V26 C36 32 30 36 20 36 C10 36 4 32 4 26 Z"/>
