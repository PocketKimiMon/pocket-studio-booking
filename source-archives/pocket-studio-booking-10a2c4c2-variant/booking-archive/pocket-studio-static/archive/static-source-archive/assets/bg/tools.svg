<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" fill="none">
  <!-- scissors -->
  <g transform="translate(180 160) rotate(-18)" opacity=".55">
    <circle cx="18" cy="18" r="14" stroke="#120E17" stroke-width="5" fill="#8ACE00"/>
    <circle cx="18" cy="72" r="14" stroke="#120E17" stroke-width="5" fill="#8ACE00"/>
    <path d="M28 28 L86 86 M28 62 L86 4" stroke="#120E17" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- comb -->
  <g transform="translate(1280 220) rotate(22)" opacity=".5">
    <rect x="0" y="0" width="22" height="110" rx="6" fill="#9B5CFF" stroke="#120E17" stroke-width="4"/>
    <path d="M22 12 H48 M22 28 H48 M22 44 H48 M22 60 H48 M22 76 H48 M22 92 H48" stroke="#120E17" stroke-width="4" stroke-linecap="round"/>
  </g>
