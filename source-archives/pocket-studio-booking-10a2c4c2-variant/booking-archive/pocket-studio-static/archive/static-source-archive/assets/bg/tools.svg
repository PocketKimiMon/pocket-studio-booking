    <rect x="8" y="0" width="54" height="22" rx="4" fill="#F3ECDE" stroke="#120E17" stroke-width="4"/>
    <path d="M14 0 V-10 M28 0 V-12 M42 0 V-10 M56 0 V-12" stroke="#120E17" stroke-width="3" stroke-linecap="round"/>
  </g>
