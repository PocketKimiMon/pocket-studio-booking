<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">

<style>

  .px { font-family:var(--font-mono); font-size:11px; color:var(--fg2); }
</style>
</head><body>
  <div class="col" style="gap:9px">
    <div class="mono-cap" style="color:var(--lime)">Spacing · 4px base · whitespace is content</div>

    <div class="row2"><span class="tok">space-6</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>

    <div class="row2"><span class="tok">touch-min</span><div class="bar" style="width:44px;background:var(--cyan)"></div><span class="px">44 · a11y floor</span></div>
  </div>
</body></html>
