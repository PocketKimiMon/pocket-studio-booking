<!-- @dsCard group="Colors" subtitle="Ink scale — charcoal / black-violet" width="700" height="190" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .sw { display:flex; flex-direction:column; gap:6px; }
  .chip { height:56px; border-radius:8px; border:1px solid var(--hairline); }
  .nm { font-family:var(--font-mono); font-size:10px; color:var(--fg3); }
  .grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; }
</style>
</head><body>
  <div class="col" style="gap:10px">
    <div class="mono-cap" style="color:var(--oxblood-bright)">Ink scale · cool charcoal · graphite, not candy</div>
    <div class="grid">
      <div class="sw"><div class="chip" style="background:var(--ink-950)"></div><span class="nm">950</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><span class="nm">900</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-850)"></div><span class="nm">850</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-800)"></div><span class="nm">800</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><span class="nm">700</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-600)"></div><span class="nm">600</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><span class="nm">500</span></div>
      <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><span class="nm">400</span></div>
    </div>
    <div class="small muted" style="font-size:12px;font-family:var(--font-sans)">900 is the app canvas · 800 cards · 700 inputs · 500 borders. Cool graphite with a faint violet-black undertone.</div>
  </div>
</body></html>
