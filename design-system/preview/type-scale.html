<!-- @dsCard group="Type" subtitle="Fluid type scale (clamp)" width="700" height="340" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="card.css">
<style>
  .scale-row { display:flex; align-items:baseline; gap:14px; }
  .scale-row .tok { font-family:var(--font-mono); font-size:11px; color:var(--fg3); width:96px; flex:none; }
  .scale-row .spec { font-family:var(--font-display); color:var(--fg1); line-height:1; letter-spacing:-0.03em; text-transform:uppercase; white-space:nowrap; }
</style>
</head><body>
  <div class="col" style="gap:12px">
    <div class="mono-cap" style="color:var(--oxblood)">Fluid type scale · clamp() · 375 → desktop</div>
    <div class="scale-row"><span class="tok">6xl · hero</span><span class="spec" style="font-size:44px;font-weight:900">Outsiders</span></div>
    <div class="scale-row"><span class="tok">4xl · h1</span><span class="spec" style="font-size:33px;font-weight:800">Build the thing</span></div>
    <div class="scale-row"><span class="tok">3xl · h2</span><span class="spec" style="font-size:26px;font-weight:800">No sludge</span></div>
    <div class="scale-row"><span class="tok">2xl · h3</span><span class="spec" style="font-size:21px;font-weight:700;font-family:var(--font-sans)">Section title</span></div>
    <div class="scale-row"><span class="tok">base · body</span><span class="spec" style="font-size:16px;font-weight:400;font-family:var(--font-sans);color:var(--fg2)">16px reading floor, fluid up</span></div>
    <div class="scale-row"><span class="tok">xs · label</span><span class="spec mono-cap" style="font-size:12px;color:var(--cyan)">MONO LABEL</span></div>
  </div>
</body></html>
